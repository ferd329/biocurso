    <script>
      // ── Búsqueda y filtros de cursos ─────────────────────────────────────
      // Se inyecta una barra de búsqueda + filtros sobre el catálogo renderizado
      (function () {
        var INSERTED = false;

        function buildUI() {
          if (INSERTED) return;

          // Buscar el contenedor del catálogo de cursos (artículos con class "group")
          var articles = document.querySelectorAll("article.group");
          if (articles.length < 2) return; // catálogo todavía no renderizado

          // Buscar el padre común
          var container = articles[0].parentElement;
          if (!container) return;

          INSERTED = true;

          // ── Crear barra de búsqueda + filtros ──
          var bar = document.createElement("div");
          bar.id = "bc-search-bar";
          bar.style.cssText = [
            "display:flex",
            "flex-wrap:wrap",
            "gap:0.6rem",
            "align-items:center",
            "margin-bottom:1.5rem",
            "padding:1rem 1.25rem",
            "background:rgba(255,255,255,0.88)",
            "border:1px solid #bfdbfe",
            "border-radius:16px",
            "box-shadow:0 2px 12px rgba(37,99,235,0.08)",
            "backdrop-filter:blur(10px)",
          ].join(";");

          // Input de búsqueda
          var input = document.createElement("input");
          input.type = "search";
          input.placeholder = "🔍  Buscar curso…";
          input.style.cssText = [
            "flex:1",
            "min-width:160px",
            "border:1.5px solid #93c5fd",
            "border-radius:999px",
            "padding:0.5rem 1rem",
            "font-size:14px",
            "outline:none",
            "background:#f0f7ff",
            "color:#1e3a8a",
            "transition:border-color 0.2s",
          ].join(";");
          input.addEventListener("focus", function () {
            input.style.borderColor = "#2563eb";
            input.style.boxShadow = "0 0 0 3px rgba(37,99,235,0.15)";
          });
          input.addEventListener("blur", function () {
            input.style.borderColor = "#93c5fd";
            input.style.boxShadow = "none";
          });

          // Selector de área
          var selArea = buildSelect(["Todas las áreas", "Biología", "Química"]);
          // Selector de nivel
          var selNivel = buildSelect(["Todos los niveles", "Preparatoria", "Universitario"]);
          // Selector de orden
          var selOrder = buildSelect(["Más populares", "Menor precio", "Mayor precio", "Mejor calificación"]);

          // Contador de resultados
          var counter = document.createElement("span");
          counter.style.cssText = "font-size:12px;color:#3b82f6;white-space:nowrap;font-weight:600;";

          bar.appendChild(input);
          bar.appendChild(selArea);
          bar.appendChild(selNivel);
          bar.appendChild(selOrder);
          bar.appendChild(counter);
          container.parentElement.insertBefore(bar, container);

          // ── Lógica de filtrado ──
          function getArticles() {
            return Array.from(document.querySelectorAll("article.group"));
          }

          function getCardData(el) {
            var text = el.innerText || el.textContent || "";
            return {
              text: text.toLowerCase(),
              area: (el.dataset.area || "").toLowerCase(),
              nivel: (el.dataset.nivel || "").toLowerCase(),
              precio: parseFloat(el.dataset.precio) || 0,
              rating: parseFloat(el.dataset.rating) || 0,
              el: el,
            };
          }

          // Intentar enriquecer las tarjetas con datos del JSON semilla
          function enrichCards() {
            if (!window.BioCursosDatos) return;
            var cursos = window.BioCursosDatos.cursos || [];
            var arts = getArticles();
            arts.forEach(function (art) {
              var title = (art.querySelector("h3,h2,[class*='font-semibold'],[class*='font-medium']") || {}).innerText || "";
              var match = cursos.find(function (c) {
                return (c.titulo || "").toLowerCase().includes(title.toLowerCase().slice(0, 10));
              });
              if (match) {
                art.dataset.area = match.area || "";
                art.dataset.nivel = match.nivel_educativo || "";
                art.dataset.precio = match.precio_individual || "0";
                art.dataset.rating = match.rating || "0";
              }
            });
          }

          enrichCards();

          function applyFilters() {
            var query = input.value.toLowerCase().trim();
            var area = selArea.value;
            var nivel = selNivel.value;
            var order = selOrder.value;
            var arts = getArticles();
            var visible = [];

            arts.forEach(function (art) {
              var d = getCardData(art);
              var show = true;
              if (query && !d.text.includes(query)) show = false;
              if (area !== "Todas las áreas" && d.area && !d.area.includes(area.toLowerCase())) show = false;
              if (nivel !== "Todos los niveles" && d.nivel && !d.nivel.includes(nivel.toLowerCase())) show = false;
              art.style.display = show ? "" : "none";
              if (show) visible.push({ el: art, d: d });
            });

            // Ordenar
            if (order === "Menor precio") visible.sort(function (a, b) { return a.d.precio - b.d.precio; });
            else if (order === "Mayor precio") visible.sort(function (a, b) { return b.d.precio - a.d.precio; });
            else if (order === "Mejor calificación") visible.sort(function (a, b) { return b.d.rating - a.d.rating; });

            visible.forEach(function (item) { container.appendChild(item.el); });

            var total = visible.length;
            counter.textContent = total + " curso" + (total !== 1 ? "s" : "");

            // Mensaje vacío
            var empty = document.getElementById("bc-empty");
            if (total === 0) {
              if (!empty) {
                empty = document.createElement("div");
                empty.id = "bc-empty";
                empty.style.cssText = "text-align:center;padding:3rem 1rem;color:#3b82f6;font-size:15px;font-weight:600;grid-column:1/-1;";
                empty.innerHTML = "😕 No encontramos cursos con esos filtros. <br><small style='font-weight:400;color:#93c5fd'>Intenta con otra búsqueda.</small>";
                container.appendChild(empty);
              }
            } else if (empty) {
              empty.remove();
            }
          }

          input.addEventListener("input", applyFilters);
          selArea.addEventListener("change", applyFilters);
          selNivel.addEventListener("change", applyFilters);
          selOrder.addEventListener("change", applyFilters);
          applyFilters();
        }

        function buildSelect(options) {
          var sel = document.createElement("select");
          sel.style.cssText = [
            "border:1.5px solid #93c5fd",
            "border-radius:999px",
            "padding:0.45rem 0.9rem",
            "font-size:13px",
            "background:#f0f7ff",
            "color:#1e40af",
            "font-weight:600",
            "cursor:pointer",
            "outline:none",
          ].join(";");
          options.forEach(function (o) {
            var opt = document.createElement("option");
            opt.value = o;
            opt.textContent = o;
            sel.appendChild(opt);
          });
          return sel;
        }

        // Observar el DOM hasta que el catálogo esté listo
        var observer = new MutationObserver(function () {
          buildUI();
        });
        observer.observe(document.getElementById("root") || document.body, {
          childList: true,
          subtree: true,
        });
        // También intentar al cargar
        window.addEventListener("load", buildUI);
        window.addEventListener("hashchange", function () {
          INSERTED = false;
          var bar = document.getElementById("bc-search-bar");
          if (bar) bar.remove();
          setTimeout(buildUI, 400);
        });
      })();
    </script>

    <script>
      // ── Validaciones en formularios de Login / Register ──────────────────
      // El bundle app.js maneja sus propios formularios con validación interna.
      // Este script refuerza visualmente cuando hay errores de red/servidor
      // y muestra mensajes inline si la API falla.
      (function () {
        function styleErrorBanner(form, msg) {
          var existing = form.querySelector(".bc-form-error");
          if (existing) existing.remove();
          var div = document.createElement("div");
          div.className = "bc-form-error";
          div.style.cssText = [
            "display:flex",
            "align-items:center",
            "gap:0.5rem",
            "background:#fef2f2",
            "border:1px solid #fca5a5",
            "border-radius:12px",
            "padding:0.75rem 1rem",
            "margin-bottom:1rem",
            "font-size:13px",
            "color:#b91c1c",
            "font-weight:600",
          ].join(";");
          div.innerHTML = "⚠️ " + msg;
          form.insertBefore(div, form.firstChild);
        }

        // Observar formularios
        var observer = new MutationObserver(function () {
          document.querySelectorAll("form:not([data-bc-patched])").forEach(function (form) {
            form.setAttribute("data-bc-patched", "1");
            form.addEventListener("submit", function (e) {
              var inputs = form.querySelectorAll("input[type=email], input[type=password], input[type=text]");
              var errors = [];
              inputs.forEach(function (inp) {
                var val = inp.value.trim();
                // Email
                if (inp.type === "email" && val && !/^\S+@\S+\.\S+$/.test(val)) {
                  errors.push("Escribe un correo válido.");
                  inp.style.borderColor = "#f87171";
                  inp.style.background = "#fef2f2";
                }
                // Contraseña
                if (inp.type === "password" && val && val.length < 6) {
                  errors.push("La contraseña debe tener al menos 6 caracteres.");
                  inp.style.borderColor = "#f87171";
                  inp.style.background = "#fef2f2";
                }
              });
              if (errors.length > 0) {
                e.preventDefault();
                e.stopImmediatePropagation();
                styleErrorBanner(form, errors[0]);
              }
            }, true);
          });
        });
        observer.observe(document.getElementById("root") || document.body, {
          childList: true,
          subtree: true,
        });
      })();
      (function () {
        var link = document.getElementById("skip-link");
        if (!link) return;
        link.addEventListener("click", function (event) {
          event.preventDefault();
          var main = document.getElementById("main-content");
          if (!main) return;
          main.setAttribute("tabindex", "-1");
          main.focus({ preventScroll: true });
          main.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      })();

      // Registro del service worker (sólo en http/https; no aplica con file://).
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {
            /* Sin conexión disponible: el sitio sigue funcionando. */
          });
        });
      }
    </script>
  </body>
